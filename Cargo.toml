[workspace]
resolver = "2"
members = [
    "crates/orkidea-adbc",
    "crates/orkidea-adbc-ffi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Tnsor-Labs/orkidea-adbc"
authors = ["Tnsor Labs"]

[workspace.dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
adbc_driver_manager = "0.25"
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
arrow-select = "59"
oracledb = { version = "=26.0.0-beta.5", features = ["arrow"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false

# Release artifacts: line-level debug info is built in, then split into a
# separate debug-symbols archive by scripts/package_release.py.
[profile.dist]
inherits = "release"
debug = "line-tables-only"

# oracledb 26.0.0-beta.5 with two fixes: oracle/rust-oracledb#80 (wide rows
# of already-parsed statements are misparsed), and tnsnames.ora aliases
# written after a comment line not being found. The fork's branch is that
# release plus those two commits. Remove once a release includes both.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "16415b2a942b248249598566871c485620102707" }
