[workspace]
resolver = "2"
members = [
    "crates/orkidea-adbc",
    "crates/orkidea-adbc-ffi",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Tnsor-Labs/orkidea-adbc"
authors = ["Tnsor Labs"]

[workspace.dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
adbc_driver_manager = "0.25"
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
oracledb = { version = "=26.0.0-beta.6", features = ["arrow"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false

# Release artifacts: line-level debug info is built in, then split into a
# separate debug-symbols archive by scripts/package_release.py.
[profile.dist]
inherits = "release"
debug = "line-tables-only"

# oracledb 26.0.0-beta.6 with row sinks (oracle/rust-oracledb#85,
# Cursor::fetch_into), which columnar fetching reads with, and JSON visitors,
# which write JSON as text from OSON. The fork's beta6-sink branch is the
# beta.6 tag plus those and one commit marking the files they change. Remove
# once a release includes them.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "d4939fd3d0268af31784eb2c425d6610e9f9d725" }
