[workspace]
resolver = "2"
members = [
    "crates/orkidea-adbc",
    "crates/orkidea-adbc-ffi",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Tnsor-Labs/orkidea-adbc"
authors = ["Tnsor Labs"]

[workspace.dependencies]
adbc_core = "0.25"
adbc_ffi = "0.25"
adbc_driver_manager = "0.25"
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
oracledb = { version = "=26.0.0-beta.6", features = ["arrow"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false

# Release artifacts: line-level debug info is built in, then split into a
# separate debug-symbols archive by scripts/package_release.py.
[profile.dist]
inherits = "release"
debug = "line-tables-only"

# oracledb's main branch as of 3dd6de4 (26.0.0-beta.6, not yet on crates.io)
# with the fix for oracle/rust-oracledb#83 (tnsnames.ora aliases written after
# a comment line are not found) and row sinks (#85, Cursor::fetch_into),
# which columnar fetching reads with. The fork's fork-next branch is that
# commit plus those two, and one marking the files they change. Remove once
# a release includes both.
[patch.crates-io]
oracledb = { git = "https://github.com/Tnsor-Labs/rust-oracledb", rev = "de04d09e618602b6787f429bcac6f84068fb2282" }
