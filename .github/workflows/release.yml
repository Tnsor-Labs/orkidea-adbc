name: Release

# Tag pushes (v*) build, test, sign, and publish a release to GitHub and the
# Python wheels to PyPI. A manual run (workflow_dispatch) does everything
# except signing and publishing, as a dry run of the release pipeline.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Read the version and match it against the tag
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "releasing ${version}"
      - name: Write the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          if python3 scripts/release_notes.py "${VERSION}" > release-notes.md; then
            cat release-notes.md
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            exit 1
          else
            echo "::warning::CHANGELOG.md has no notes for ${VERSION}; a tag would fail here"
            echo "No notes for ${VERSION}." > release-notes.md
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    # Linux builds run in manylinux_2_28, so the library needs glibc 2.28 or
    # newer (RHEL 8+, Debian 10+, Ubuntu 18.10+).
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
            python: /opt/python/cp312-cp312/bin/python
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            python: /opt/python/cp312-cp312/bin/python
          - platform: macos_arm64
            runner: macos-15
            target: aarch64-apple-darwin
            container: ''
            python: python
          - platform: macos_amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            container: ''
            python: python
          - platform: windows_amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            container: ''
            python: python
          - platform: windows_arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ''
            python: python
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.python }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.container == ''
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --locked --profile dist -p orkidea-adbc-ffi --target "${TARGET}"
          cargo build --locked --profile dist -p orkidea-adbc-ffi --example load_check --target "${TARGET}"
      - name: Package
        run: python3 scripts/package_release.py --target "${TARGET}" --platform "${PLATFORM}" --version "${VERSION}" --out dist
      - name: Smoke-test the packaged library
        run: |
          set -euo pipefail
          check="target/${TARGET}/dist/examples/load_check"
          cd dist
          if [[ "${PLATFORM}" == windows_* ]]; then
            archive="orkidea-adbc-${VERSION}-${PLATFORM}.zip"
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('check')" "${archive}"
            library="adbc_driver_orkidea.dll"
          else
            archive="orkidea-adbc-${VERSION}-${PLATFORM}.tar.gz"
            mkdir -p check && tar -xzf "${archive}" -C check
            library="libadbc_driver_orkidea.so"
            if [[ "${PLATFORM}" == macos_* ]]; then library="libadbc_driver_orkidea.dylib"; fi
          fi
          "../${check}" --path "check/orkidea-adbc-${VERSION}-${PLATFORM}/lib/${library}"
          rm -rf check
      - name: Show the library's platform requirements
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux_*)
              tar -xzf "dist/orkidea-adbc-${VERSION}-${PLATFORM}.tar.gz" -C "${RUNNER_TEMP}"
              lib="${RUNNER_TEMP}/orkidea-adbc-${VERSION}-${PLATFORM}/lib/libadbc_driver_orkidea.so"
              newest="$(objdump -T "${lib}" | grep -oE 'GLIBC_[0-9.]+' | sort -t. -k2 -n -u | tail -1)"
              echo "newest glibc symbol: ${newest}"
              highest="$(printf '%s\n' GLIBC_2.28 "${newest}" | sort -V | tail -1)"
              [[ "${highest}" == "GLIBC_2.28" ]] || { echo "::error::the library needs ${newest}"; exit 1; }
              ;;
            macos_*)
              tar -xzf "dist/orkidea-adbc-${VERSION}-${PLATFORM}.tar.gz" -C "${RUNNER_TEMP}"
              lib="${RUNNER_TEMP}/orkidea-adbc-${VERSION}-${PLATFORM}/lib/libadbc_driver_orkidea.dylib"
              otool -l "${lib}" | grep -A3 LC_BUILD_VERSION | grep minos
              codesign --verify --verbose "${lib}"
              ;;
          esac
      - name: Test the installer and manifest discovery (Linux, macOS)
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        run: |
          set -euo pipefail
          archive="orkidea-adbc-${VERSION}-${PLATFORM}.tar.gz"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${archive}" > SHA256SUMS)
          else
            (cd dist && shasum -a 256 "${archive}" > SHA256SUMS)
          fi
          export HOME="${RUNNER_TEMP}/home" XDG_CONFIG_HOME="${RUNNER_TEMP}/home/.config" XDG_DATA_HOME="${RUNNER_TEMP}/home/.local/share"
          mkdir -p "${HOME}"
          sh scripts/install.sh --archive "dist/orkidea-adbc-${VERSION}-${PLATFORM}.tar.gz"
          "target/${TARGET}/dist/examples/load_check" --name orkidea
          rm dist/SHA256SUMS
      - name: Test the installer and manifest discovery (Windows)
        if: ${{ startsWith(matrix.platform, 'windows') }}
        shell: pwsh
        run: |
          $archive = "dist\orkidea-adbc-$env:VERSION-$env:PLATFORM.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content dist\SHA256SUMS
          ./scripts/install.ps1 -Archive $archive
          & "target\$env:TARGET\dist\examples\load_check.exe" --name orkidea
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist\SHA256SUMS
      - name: Build the Python wheel
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux_*) ext=tar.gz library=libadbc_driver_orkidea.so ;;
            macos_*) ext=tar.gz library=libadbc_driver_orkidea.dylib ;;
            windows_*) ext=zip library=adbc_driver_orkidea.dll ;;
          esac
          # The wheel bundles the library and license files of the release
          # archive, so both distributions ship identical bits. `pwd -W`
          # gives a path native Python understands on Windows.
          input="$(pwd -W 2>/dev/null || pwd)/.wheel-input"
          "${PYTHON}" -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])" \
            "dist/orkidea-adbc-${VERSION}-${PLATFORM}.${ext}" "${input}"
          root="${input}/orkidea-adbc-${VERSION}-${PLATFORM}"
          ORKIDEA_ADBC_LIBRARY="${root}/lib/${library}" \
          ORKIDEA_ADBC_THIRD_PARTY_LICENSES="${root}/THIRD_PARTY_LICENSES" \
          ORKIDEA_ADBC_PLATFORM="${PLATFORM}" \
            "${PYTHON}" -m pip wheel --no-deps --wheel-dir dist ./python
          ls -l dist/*.whl
      - name: Check the wheel's manylinux tag
        if: startsWith(matrix.platform, 'linux')
        run: |
          set -euo pipefail
          report="$(auditwheel show dist/*.whl)"
          echo "${report}"
          policy="$(sed -n 's/.*following platform tag: "manylinux_\([0-9]*\)_\([0-9]*\)_.*/\1.\2/p' <<< "${report}")"
          [[ -n "${policy}" ]] || { echo "::error::auditwheel reported no manylinux policy"; exit 1; }
          highest="$(printf '%s\n' 2.28 "${policy}" | sort -V | tail -1)"
          [[ "${highest}" == "2.28" ]] || { echo "::error::the wheel needs manylinux_${policy}"; exit 1; }
      - name: Test the Python wheel
        run: |
          set -euo pipefail
          "${PYTHON}" -m venv .wheel-venv
          venv_python=.wheel-venv/bin/python
          [[ "${PLATFORM}" == windows_* ]] && venv_python=.wheel-venv/Scripts/python.exe
          wheel="$(ls dist/*.whl)"
          if [[ "${PLATFORM}" == windows_arm64 ]]; then
            # pyarrow publishes no Windows arm64 wheels: test without the
            # DB-API, which needs pyarrow.
            "${venv_python}" -m pip install "${wheel}" pytest
          else
            "${venv_python}" -m pip install "${wheel}[test]"
          fi
          "${venv_python}" -I -m pytest -p no:cacheprovider -rs python/tests
      - name: Keep the load check for compatibility tests
        if: startsWith(matrix.platform, 'linux')
        run: cp "target/${TARGET}/dist/examples/load_check" "dist/load_check-${PLATFORM}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  compat:
    name: compat (${{ matrix.image }}, ${{ matrix.platform }})
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux_amd64, runner: ubuntu-24.04, image: 'rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c' }
          - { platform: linux_amd64, runner: ubuntu-24.04, image: 'debian:11@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9' }
          - { platform: linux_amd64, runner: ubuntu-24.04, image: 'amazonlinux:2023@sha256:3ccfbe800f864982b0a4e124a614b2382518cbd04b3c1cd35202bd46f392675b' }
          - { platform: linux_arm64, runner: ubuntu-24.04-arm, image: 'rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c' }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.platform }}
          path: dist
      - name: Load the driver on an older distribution
        run: |
          set -euo pipefail
          mkdir -p check
          tar -xzf "dist/orkidea-adbc-${VERSION}-${PLATFORM}.tar.gz" -C check
          chmod +x "dist/load_check-${PLATFORM}"
          docker run --rm -v "${PWD}:/w:ro" "${IMAGE}" sh -c "
            grep PRETTY_NAME /etc/os-release
            /w/dist/load_check-${PLATFORM} --path /w/check/orkidea-adbc-${VERSION}-${PLATFORM}/lib/libadbc_driver_orkidea.so"

  assemble:
    name: assemble
    needs: [version, build, compat]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - name: Check that every platform was built
        run: |
          set -euo pipefail
          rm -f dist/load_check-*
          for platform in linux_amd64 linux_arm64 macos_amd64 macos_arm64 windows_amd64 windows_arm64; do
            ext=tar.gz; [[ "${platform}" == windows_* ]] && ext=zip
            for suffix in "" "-debug"; do
              test -f "dist/orkidea-adbc-${VERSION}-${platform}${suffix}.${ext}" \
                || { echo "::error::missing ${platform}${suffix}"; exit 1; }
            done
          done
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 macosx_11_0_x86_64 \
                     macosx_11_0_arm64 win_amd64 win_arm64; do
            compgen -G "dist/adbc_driver_orkidea-*-py3-none-${tag}.whl" >/dev/null \
              || { echo "::error::missing the ${tag} wheel"; exit 1; }
          done
      - name: Check the wheels' metadata
        run: pipx run twine==7.0.0 check --strict dist/*.whl
      - name: Generate per-platform SBOMs
        run: |
          set -euo pipefail
          for pair in linux_amd64:x86_64-unknown-linux-gnu linux_arm64:aarch64-unknown-linux-gnu \
                      macos_amd64:x86_64-apple-darwin macos_arm64:aarch64-apple-darwin \
                      windows_amd64:x86_64-pc-windows-msvc windows_arm64:aarch64-pc-windows-msvc; do
            platform="${pair%%:*}"; target="${pair#*:}"
            cargo cyclonedx --format json --target "${target}" --manifest-path crates/orkidea-adbc-ffi/Cargo.toml
            mv crates/orkidea-adbc-ffi/orkidea-adbc-ffi.cdx.json "dist/orkidea-adbc-${VERSION}-${platform}.cdx.json"
          done
      - name: Add installers and checksums
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless Sigstore signing and attestations
      attestations: write # build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          [[ "${GITHUB_REF_NAME}" == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --notes-file notes/release-notes.md \
            --title "Orkidea ADBC ${GITHUB_REF_NAME}" "${flags[@]}"

  pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    # PyPI trusted publishing: PyPI accepts uploads from this workflow and
    # environment only, so no API token is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/project/adbc-driver-orkidea/
    permissions:
      id-token: write # trusted publishing and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Select the wheels
        run: mkdir wheels && mv release/*.whl wheels/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels
