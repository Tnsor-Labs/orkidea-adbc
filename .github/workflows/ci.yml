name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p orkidea-adbc-ffi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --workspace --all-targets --locked

  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check executable scripts
        run: bash -n scripts/*.sh
      - name: Check for committed local credentials
        run: |
          ! git grep -n -E 'Oracle123|AdbcDemo123|Arrow123' -- . ':!Cargo.lock' ':!.github/workflows/ci.yml'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --locked check
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings
      - uses: taiki-e/install-action@cargo-cyclonedx
      # Writes one SBOM per crate next to its Cargo.toml; the FFI crate's SBOM
      # describes the shipped shared library and its full dependency tree.
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: orkidea-sbom
          path: crates/orkidea-adbc-ffi/orkidea-adbc-ffi.cdx.json
          if-no-files-found: error
