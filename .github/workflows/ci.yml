name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p orkidea-adbc-ffi

  oracle-integration:
    name: oracle integration (Oracle Database Free 23ai)
    runs-on: ubuntu-latest
    env:
      # Oracle Database Free, pulled at CI time and never redistributed.
      # Pinned by digest; update deliberately.
      ORACLE_IMAGE: gvenzl/oracle-free@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Start Oracle Database Free
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name oracle -p 127.0.0.1:1521:1521 \
            -e ORACLE_PASSWORD="${password}" \
            -e APP_USER=orkidea_test -e APP_USER_PASSWORD="${password}" \
            "${ORACLE_IMAGE}"
          {
            echo "ORACLE_ADMIN_PASSWORD=${password}"
            echo "ORKIDEA_ADBC_URI=oracle://orkidea_test:${password}@127.0.0.1:1521/FREEPDB1"
            echo "ORKIDEA_ADBC_ADMIN_URI=oracle://sys:${password}@127.0.0.1:1521/FREEPDB1"
          } >> "${GITHUB_ENV}"
      - name: Build tests while the database starts
        run: cargo test --workspace --locked --no-run
      - name: Wait for the database
        run: |
          for _ in $(seq 1 90); do
            if docker logs oracle 2>&1 | grep -q 'DATABASE IS READY TO USE!'; then
              exit 0
            fi
            sleep 5
          done
          docker logs oracle 2>&1 | tail -50
          exit 1
      - name: Grant test privileges
        run: |
          docker exec -i oracle sqlplus -s -L "sys/${ORACLE_ADMIN_PASSWORD}@FREEPDB1 as sysdba" <<'SQL'
          WHENEVER SQLERROR EXIT FAILURE
          GRANT CREATE SESSION, CREATE TABLE, CREATE VIEW, CREATE PROCEDURE,
                CREATE MATERIALIZED VIEW, CREATE SEQUENCE TO orkidea_test;
          ALTER USER orkidea_test QUOTA UNLIMITED ON USERS;
          GRANT EXECUTE ON DBMS_FLASHBACK TO orkidea_test;
          SQL
      - name: Run tests against Oracle
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.89'
      - run: cargo check --workspace --all-targets --locked

  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check executable scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/install.sh
          python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" scripts/package_release.py
          # shellcheck disable=SC2016 # PowerShell variables, not shell ones
          pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$e) | Out-Null; if ($e) { $e | ForEach-Object { $_.ToString() }; exit 1 }'
      - name: Check for committed local credentials
        run: |
          ! git grep -n -E 'Oracle123|AdbcDemo123|Arrow123' -- . ':!Cargo.lock' ':!.github/workflows/ci.yml'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx
      # Writes one SBOM per crate next to its Cargo.toml; the FFI crate's SBOM
      # describes the shipped shared library and its full dependency tree.
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orkidea-sbom
          path: crates/orkidea-adbc-ffi/orkidea-adbc-ffi.cdx.json
          if-no-files-found: error
